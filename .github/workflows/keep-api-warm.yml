name: Keep API warm

# Ping /health so App Service (F1) does not idle out (~20 min). Does not hit SQL.
# GitHub free tier: ~1–2 min/day if the API is already warm; occasional cold-start
# pings take longer but stay well within monthly Actions minutes for a private repo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        env:
          API_HEALTH_URL: https://app-wfh-diary-api-dev.azurewebsites.net/health
        run: |
          echo "Pinging $API_HEALTH_URL"
          curl -fsS \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 30 \
            --max-time 180 \
            "$API_HEALTH_URL"
          echo "OK"
