# Publishes debug APK to public Evzy/wfh-diary-releases when merging to main.
# Secret: WFH_RELEASES_TOKEN. See docs/CI_CD.md.
name: Release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASES_REPO: ${{ github.repository_owner }}/wfh-diary-releases

jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      run_dotnet_tests: false

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/*.gradle*
            apps/android/**/*.gradle*

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Decode shared debug keystore
        env:
          B64: ${{ secrets.WFH_SHARED_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::notice::WFH_SHARED_DEBUG_KEYSTORE_B64 not set — runner default debug key"
          else
            echo "$B64" | base64 -d > "${{ github.workspace }}/apps/android/app/ci-shared-debug.keystore"
          fi

      - name: Build debug APK
        working-directory: apps/android
        env:
          CI: "true"
          WFH_SHARED_DEBUG_KEYSTORE: ${{ github.workspace }}/apps/android/app/ci-shared-debug.keystore
          WFH_SHARED_DEBUG_STORE_PASSWORD: ${{ secrets.WFH_SHARED_DEBUG_STORE_PASSWORD }}
          WFH_SHARED_DEBUG_KEY_ALIAS: ${{ secrets.WFH_SHARED_DEBUG_KEY_ALIAS }}
          WFH_SHARED_DEBUG_KEY_PASSWORD: ${{ secrets.WFH_SHARED_DEBUG_KEY_PASSWORD }}
          UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          UPDATE_GITHUB_REPO: wfh-diary-releases
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wfh-diary-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Resolve release tag and APK filename
        id: meta
        if: github.event_name == 'push'
        run: |
          set -e
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            V=$(python3 -c "import json; print(json.load(open('version.json'))['versionName'])")
            TAG="v${V}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "mode=main" >> "$GITHUB_OUTPUT"
            cp "apps/android/app/build/outputs/apk/debug/app-debug.apk" "WfhDiary-${TAG}-debug.apk"
            echo "apk=WfhDiary-${TAG}-debug.apk" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            T="${{ github.ref_name }}"
            echo "tag=${T}" >> "$GITHUB_OUTPUT"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
            cp "apps/android/app/build/outputs/apk/debug/app-debug.apk" "WfhDiary-${T}-debug.apk"
            echo "apk=WfhDiary-${T}-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists (main only)
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.WFH_RELEASES_TOKEN }}
          REPO: ${{ env.RELEASES_REPO }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "exists=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::WFH_RELEASES_TOKEN not set — skipping publish"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release to wfh-diary-releases
        if: >
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.ref == 'refs/heads/main' && steps.check.outputs.exists == 'false'))
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.WFH_RELEASES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: WFH Diary ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.apk }}
          generate_release_notes: true
