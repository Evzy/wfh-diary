on:
  workflow_call:
    inputs:
      run_dotnet_tests:
        description: "Run dotnet test WfhDiary.sln"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  dotnet-test:
    if: inputs.run_dotnet_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version files match version.json
        shell: bash
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bump-version.ps1 -SyncOnly
          git diff --exit-code version.json services/api/WfhDiary.Api/AppVersion.cs services/api/WfhDiary.Api/WfhDiary.Api.csproj
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test solution
        run: dotnet test WfhDiary.sln -c Release

  android-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/*.gradle*
            apps/android/**/*.gradle*
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: chmod +x gradlew
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
